[package]
name = "crypto-erc20"
description = "Template project for `openzeppelin-stylus` & `openzeppelin-crypto`"
version = "0.1.0"
publish = false
edition = "2021"
license = "MIT"

[dependencies]
openzeppelin-crypto = { path = "../../lib/crypto", features = ["ruint"] }
openzeppelin-stylus = { path = "../../contracts" }

alloy-primitives = { version = "=1.7.3", default-features = false, features = [
    "tiny-keccak",
] }
stylus-sdk = "=0.10.10"

[dev-dependencies]
stylus-sdk = { version = "=0.10.10", features = ["stylus-test"] }
alloy = { version = "=1.7.3", features = [
    "contract",
    "network",
    "providers",
    "provider-http",
    "rpc-client",
    "rpc-types-eth",
    "signer-local",
    "getrandom",
] }
eyre = "0.6.8"
stylus-test-support = { path = "../../lib/stylus-test-support" }
tokio = { version = "1.12.0", features = ["full"] }
arbitrary = { version = "1.4.1", features = ["derive"] }

[features]
devnet = []
default = ["mini-alloc"]
# stylus-sdk/export-abi will be enabled automatically.
export-abi = ["openzeppelin-stylus/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]

[[bin]]
name = "crypto-erc20"
path = "src/main.rs"

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
lto = true
debug = false
rpath = false
debug-assertions = false
incremental = false

[profile.dev]
panic = "abort"
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("contract-client-gen"))'] }
