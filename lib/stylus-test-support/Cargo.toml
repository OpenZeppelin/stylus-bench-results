[package]
name = "stylus-test-support"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Keep Alloy's dynamic ABI decoder aligned with the pinned 1.7.3 parser/types.
alloy-dyn-abi.workspace = true
alloy = { version = "=1.7.3", features = [
  "contract",
  "network",
  "providers",
  "provider-http",
  "rpc-client",
  "rpc-types-eth",
  "signer-local",
  "getrandom",
] }
cargo_metadata = "0.20"
eyre = "0.6.8"
stylus-sdk = "=0.10.10"
stylus-tools = { version = "=0.10.10", features = ["integration-tests"] }
tempfile = "=3.20.0"
tokio = { version = "1.12.0", features = ["full"] }

[dev-dependencies]
serde_json = "1.0"
