# This workflow runs our end-to-end tests suite.
#
# The SDK integration-test tooling manages a Nitro devnet in Docker. Each integration-test binary
# shares its node across tests and creates funded accounts as needed.
name: e2e
permissions:
  contents: read
on:
  push:
    branches: [main, v*]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  required:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.0
          cache-key: "e2e-tests"
          rustflags: ""

      - name: Install wasm-opt
        run: cargo install wasm-opt@0.116.1

      - name: run integration tests
        run: ./scripts/e2e-tests.sh
