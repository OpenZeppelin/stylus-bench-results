# This workflow runs our end-to-end tests suite.
#
# It roughly follows these steps:
# - Install rust
# - Install the pinned Rust and cargo-stylus versions
# - Run the examples' integration tests against SDK-managed Nitro devnets
#
# stylus-tools starts and stops the Nitro container through Testcontainers.
# The hosted Linux runner must have a working Docker daemon and Docker Hub access.
name: e2e
permissions:
  contents: read
on:
  push:
    branches: [main, v*]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  required:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.0
          target: wasm32-unknown-unknown
          cache-key: "e2e-tests"
          rustflags: ""

      - name: Install cargo-stylus
        run: cargo install --locked --force cargo-stylus@0.10.10

      - name: Verify cargo-stylus installation
        run: cargo stylus --version | grep -F '0.10.10'

      - name: Install pinned wasm-opt
        run: cargo install --locked --force wasm-opt@0.116.1

      - name: Check Docker daemon
        run: docker info

      - name: run integration tests
        run: ./scripts/e2e-tests.sh
