name: gas-bench
# This workflow checks that the compiled wasm binary of every example contract
# can be deployed to Arbitrum Stylus.
permissions:
  contents: read
on:
  push:
    branches: [main, v*]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  required:
    name: Gas usage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.0
          cache-key: "gas-bench"
          rustflags: ""

      - name: Install cargo-stylus
        run: cargo install --locked --force cargo-stylus@0.10.10

      - name: Install pinned WebAssembly optimizer and validator
        run: |
          cargo install --locked --force wasm-opt@0.116.1
          cargo install --locked --force wasm-tools@1.262.0

      - name: run benches
        run: ./scripts/devnet.sh run -- ./scripts/bench.sh
