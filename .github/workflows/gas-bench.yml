name: gas-bench
# This workflow runs the gas benchmarks against the Stylus SDK devnet.
# The hosted Linux runner must have a working Docker daemon and Docker Hub access;
# stylus-tools starts and stops the Nitro container through Testcontainers.
permissions:
  contents: read
on:
  push:
    branches: [main, v*]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  required:
    name: Gas usage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.0
          target: wasm32-unknown-unknown
          cache-key: "gas-bench"
          rustflags: ""

      - name: Install cargo-stylus
        run: cargo install --locked --force cargo-stylus@0.10.10

      - name: Verify cargo-stylus installation
        run: cargo stylus --version | grep -F '0.10.10'

      - name: Install wasm-opt
        run: cargo install --locked --force wasm-opt@0.116.1

      - name: Check Docker daemon
        run: docker info

      - name: run benches
        run: ./scripts/bench.sh
