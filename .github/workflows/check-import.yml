name: check-import
# This workflow checks that developers can import the contracts and crypto library.
permissions:
  contents: read
on:
  push:
    branches: [main, v*]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
jobs:
  check-import:
    name: Check Import
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.0
          rustflags: ""
          cache: true
          target: wasm32-unknown-unknown

      - name: Install cargo-stylus
        run: cargo install --locked --force cargo-stylus@0.10.10

      - name: Install pinned WebAssembly optimizer and validator
        run: |
          cargo install --locked --force wasm-opt@0.116.1
          cargo install --locked --force wasm-tools@1.262.0

      - name: Verify cargo-stylus installation
        run: cargo stylus --version

      - name: Replace path dependencies with git dependencies
        working-directory: templates/crypto-erc20
        run: |
          # Get current commit SHA
          COMMIT_SHA=$(git rev-parse HEAD)

          # Replace path dependencies with git references
          sed -i \
            -e "s|path = \"../../lib/crypto\"|git = \"https://github.com/OpenZeppelin/rust-contracts-stylus.git\", rev = \"$COMMIT_SHA\"|g" \
            -e "s|path = \"../../contracts\"|git = \"https://github.com/OpenZeppelin/rust-contracts-stylus.git\", rev = \"$COMMIT_SHA\"|g" \
            Cargo.toml

          # Verify changes
          grep -E "(openzeppelin|git =|rev =)" Cargo.toml | head -10

      - name: Run tests
        working-directory: templates/crypto-erc20
        run: cargo test --locked

      - name: Build and check contract on devnet
        working-directory: templates/crypto-erc20
        run: >-
          ../../scripts/devnet.sh run -- bash -c
          'source ../../scripts/wasm-opt-wrapper/env.sh &&
          cargo stylus check --contract crypto-erc20 --endpoint "$RPC_URL"'

      - name: Export ABI
        working-directory: templates/crypto-erc20
        run: |
          source ../../scripts/wasm-opt-wrapper/env.sh
          cargo stylus export-abi
