name: check-wasm
# This workflow uses the SDK devnet to build, check, deploy, and activate each
# example contract. The SDK integration-test harness starts Nitro in Docker.
permissions:
  contents: read
on:
  push:
    branches: [main, v*]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  check-wasm:
    name: Check and activate WASM on SDK devnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.0
          target: wasm32-unknown-unknown
          rustflags: ""

      - name: Install wasm-opt
        run: cargo install wasm-opt@0.116.1

      - name: Run SDK devnet checks
        run: ./scripts/check-wasm.sh
